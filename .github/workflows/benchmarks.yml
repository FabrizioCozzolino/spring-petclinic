name: Microbenchmarks

on:
  schedule:
    # Esecuzione settimanale (ogni domenica a mezzanotte UTC) per rilevare regressioni prestazionali
    - cron: '0 0 * * 0'
  workflow_dispatch: # Consente l'avvio manuale dalla tab Actions di GitHub

jobs:
  benchmark:
    runs-on: ubuntu-latest

    services:
      amber-jpt:
        image: antoniotrovato/amber-jpt-service:latest
        ports:
          - 5001:5001
        options: --memory=6g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JMH benchmark fat-jar
        run: ./mvnw clean package -DskipTests -Pbenchmark

      - name: Wait for AMBER JPT service
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5001/ > /dev/null; then
              echo "AMBER JPT service is ready."
              break
            fi
            echo "Waiting for JPT service..."
            sleep 5
          done

      - name: Run JMH benchmarks with AMBER (@DynamicHalt)
        run: |
          mkdir -p target/jmh-results
          java -jar target/benchmarks.jar -f 1 -w 500ms -r 500ms -rf json -rff target/jmh-results/jmh-amber-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-amber-benchmark-results
          path: target/jmh-results/jmh-amber-results.json